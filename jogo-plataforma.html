<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Viewport para celular: sem zoom, sem ajuste de escala -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sobrevivente - Plataforma 2D</title>
<style>
  /* ===== RESET + TRAVAS DE TOQUE (sem scroll/zoom no celular) ===== */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07070f;
    touch-action: none; overscroll-behavior: none;
    position: fixed; font-family: monospace;
  }
  #containerJogo {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
  }

  /* ===== CONTROLES DE TOQUE (sobre o canvas) ===== */
  #controles { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  .botao {
    position: absolute; bottom: 24px; width: 78px; height: 78px;
    border-radius: 50%;
    background: rgba(60,70,110,0.35);
    border: 2px solid rgba(150,170,230,0.5);
    color: rgba(220,230,255,0.9);
    font-size: 30px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
  }
  .botao.ativo { background: rgba(120,140,220,0.55); transform: scale(0.92); }
  #btnEsquerda { left: 20px; }
  #btnDireita  { left: 110px; }
  #btnPular    { right: 110px; background: rgba(60,110,90,0.35); border-color: rgba(120,230,170,0.5); }
  #btnAtacar   { right: 20px;  background: rgba(120,60,70,0.35);  border-color: rgba(230,130,140,0.5); }
  #ajuda {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    color: rgba(190,205,245,0.75); font-size: 12px; text-align: center;
    z-index: 11; pointer-events: none; transition: opacity 1s; line-height: 1.5;
  }
  #carregando {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#aab; font-size:16px; z-index:20; background:#07070f;
  }
</style>
</head>
<body>
  <div id="containerJogo">
    <canvas id="tela"></canvas>
    <div id="controles">
      <div id="btnEsquerda" class="botao">&#9664;</div>
      <div id="btnDireita"  class="botao">&#9654;</div>
      <div id="btnPular"    class="botao">&#10514;</div>
      <div id="btnAtacar"   class="botao">&#10022;</div>
    </div>
    <div id="ajuda">Toque nos bot&otilde;es para jogar<br>No PC: &larr; &rarr; mover, Z pular, X atacar</div>
    <div id="carregando">Carregando...</div>
  </div>

  // ----------------------------------------------------------------
  // CANVAS E RESOLUCAO VIRTUAL
  // ----------------------------------------------------------------
  const canvas = document.getElementById("tela");
  const ctx = canvas.getContext("2d");
  const LARGURA_VIRTUAL = 480;
  const ALTURA_VIRTUAL = 270;   // 16:9

  function ajustarCanvas() {
    const escala = Math.min(window.innerWidth / LARGURA_VIRTUAL,
                            window.innerHeight / ALTURA_VIRTUAL);
    canvas.width = LARGURA_VIRTUAL;
    canvas.height = ALTURA_VIRTUAL;
    canvas.style.width = (LARGURA_VIRTUAL * escala) + "px";
    canvas.style.height = (ALTURA_VIRTUAL * escala) + "px";
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener("resize", ajustarCanvas);
  window.addEventListener("orientationchange", ajustarCanvas);
  ajustarCanvas();

  // ----------------------------------------------------------------
  // CARREGAMENTO DAS IMAGENS (base64 -> Image)
  // ----------------------------------------------------------------
  const imgCenario = new Image();
  const imgAtlas = new Image();
  let carregadas = 0;
  function aoCarregar() {
    carregadas++;
    if (carregadas >= 2) {
      const el = document.getElementById("carregando");
      if (el) el.style.display = "none";
      requestAnimationFrame(loop);   // inicia o jogo so com tudo pronto
    }
  }
  imgCenario.onload = aoCarregar;
  imgAtlas.onload = aoCarregar;
  imgCenario.src = SCENE_SRC;
  imgAtlas.src = ATLAS_SRC;

  // ----------------------------------------------------------------
  // FISICA DO MUNDO
  // ----------------------------------------------------------------
  const GRAVIDADE = 0.6;
  const VELOCIDADE_ANDAR = 2.6;
  const FORCA_PULO = 11;
  const ATRITO = 0.8;

  // ----------------------------------------------------------------
  // NIVEL: chao + plataformas
  // ----------------------------------------------------------------
  const ALTURA_CHAO = 38;
  const chao = { x: 0, y: ALTURA_VIRTUAL - ALTURA_CHAO, largura: LARGURA_VIRTUAL, altura: ALTURA_CHAO };
  const plataformas = [
    { x: 60,  y: 200, largura: 90, altura: 14 },
    { x: 200, y: 165, largura: 80, altura: 14 },
    { x: 330, y: 132, largura: 90, altura: 14 },
    { x: 150, y: 108, largura: 60, altura: 14 }
  ];
  const solidos = [chao].concat(plataformas);

  // ----------------------------------------------------------------
  // JOGADOR
  // ----------------------------------------------------------------
  // Caixa de colisao (menor que o sprite; o sprite e desenhado por cima).
  const jogador = {
    x: 40, y: 120, largura: 24, altura: 50,
    velX: 0, velY: 0, noChao: false,
    direcao: 1,                 // 1 direita, -1 esquerda
    estado: "parado",
    atacando: false, tempoAtaque: 0, DURACAO_ATAQUE: 24, podeAtacar: true,
    hitbox: null,
    // animacao
    quadro: 0, tempoQuadro: 0
  };

  // Altura desejada do sprite na tela (em pixels virtuais).
  const ALTURA_SPRITE = 64;
  // Fator de escala: baseado na altura do primeiro quadro "parado".
  let fatorSprite = 1;

  // ----------------------------------------------------------------
  // ENTRADA (teclado + toque), com multitoque
  // ----------------------------------------------------------------
  const teclas = { esquerda: false, direita: false, pular: false, atacar: false };

  window.addEventListener("keydown", (e) => {
    switch (e.code) {
      case "ArrowLeft":  case "KeyA": teclas.esquerda = true; break;
      case "ArrowRight": case "KeyD": teclas.direita = true; break;
      case "ArrowUp":    case "KeyZ": case "Space": teclas.pular = true; e.preventDefault(); break;
      case "KeyX":       teclas.atacar = true; break;
    }
  });
  window.addEventListener("keyup", (e) => {
    switch (e.code) {
      case "ArrowLeft":  case "KeyA": teclas.esquerda = false; break;
      case "ArrowRight": case "KeyD": teclas.direita = false; break;
      case "ArrowUp":    case "KeyZ": case "Space": teclas.pular = false; break;
      case "KeyX":       teclas.atacar = false; jogador.podeAtacar = true; break;
    }
  });

  function configurarBotao(id, acao) {
    const el = document.getElementById(id);
    const pressionar = (e) => { e.preventDefault(); teclas[acao] = true; el.classList.add("ativo"); };
    const soltar = (e) => {
      e.preventDefault(); teclas[acao] = false; el.classList.remove("ativo");
      if (acao === "atacar") jogador.podeAtacar = true;
    };
    el.addEventListener("touchstart", pressionar, { passive: false });
    el.addEventListener("touchend", soltar, { passive: false });
    el.addEventListener("touchcancel", soltar, { passive: false });
    el.addEventListener("mousedown", pressionar);
    el.addEventListener("mouseup", soltar);
    el.addEventListener("mouseleave", soltar);
  }
  configurarBotao("btnEsquerda", "esquerda");
  configurarBotao("btnDireita", "direita");
  configurarBotao("btnPular", "pular");
  configurarBotao("btnAtacar", "atacar");

  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  let ultimoToque = 0;
  document.addEventListener("touchend", (e) => {
    const agora = Date.now();
    if (agora - ultimoToque < 300) e.preventDefault();
    ultimoToque = agora;
  }, { passive: false });

  // ----------------------------------------------------------------
  // COLISAO AABB
  // ----------------------------------------------------------------
  function colide(a, b) {
    return a.x < b.x + b.largura && a.x + a.largura > b.x &&
           a.y < b.y + b.altura && a.y + a.altura > b.y;
  }

  // ----------------------------------------------------------------
  // UPDATE (logica/fisica)
  // ----------------------------------------------------------------
  function update() {
    // Horizontal
    if (teclas.esquerda && !teclas.direita) { jogador.velX = -VELOCIDADE_ANDAR; jogador.direcao = -1; }
    else if (teclas.direita && !teclas.esquerda) { jogador.velX = VELOCIDADE_ANDAR; jogador.direcao = 1; }
    else { jogador.velX *= ATRITO; if (Math.abs(jogador.velX) < 0.1) jogador.velX = 0; }

    // Pulo
    if (teclas.pular && jogador.noChao) { jogador.velY = -FORCA_PULO; jogador.noChao = false; }

    // Inicio do ataque (uma vez por toque)
    if (teclas.atacar && jogador.podeAtacar && !jogador.atacando) {
      jogador.atacando = true; jogador.tempoAtaque = jogador.DURACAO_ATAQUE;
      jogador.podeAtacar = false; jogador.quadro = 0; jogador.tempoQuadro = 0;
    }

    // Gravidade
    jogador.velY += GRAVIDADE;
    if (jogador.velY > 14) jogador.velY = 14;

    // Eixo X + colisao
    jogador.x += jogador.velX;
    for (const s of solidos) {
      if (colide(jogador, s)) {
        if (jogador.velX > 0) jogador.x = s.x - jogador.largura;
        else if (jogador.velX < 0) jogador.x = s.x + s.largura;
        jogador.velX = 0;
      }
    }

    // Eixo Y + colisao
    jogador.noChao = false;
    jogador.y += jogador.velY;
    for (const s of solidos) {
      if (colide(jogador, s)) {
        if (jogador.velY > 0) { jogador.y = s.y - jogador.altura; jogador.velY = 0; jogador.noChao = true; }
        else if (jogador.velY < 0) { jogador.y = s.y + s.altura; jogador.velY = 0; }
      }
    }

    // Limites do mundo
    if (jogador.x < 0) jogador.x = 0;
    if (jogador.x + jogador.largura > LARGURA_VIRTUAL) jogador.x = LARGURA_VIRTUAL - jogador.largura;
    if (jogador.y > ALTURA_VIRTUAL + 60) { jogador.x = 40; jogador.y = 100; jogador.velY = 0; }

    // Ataque: hitbox na frente
    if (jogador.atacando) {
      jogador.tempoAtaque--;
      const larguraGolpe = 22;
      jogador.hitbox = {
        x: jogador.direcao === 1 ? jogador.x + jogador.largura : jogador.x - larguraGolpe,
        y: jogador.y + 6, largura: larguraGolpe, altura: jogador.altura - 12
      };
      if (jogador.tempoAtaque <= 0) { jogador.atacando = false; jogador.hitbox = null; }
    }

    // Estado visual (prioridade: atacar > pular > andar > parado)
    let novoEstado;
    if (jogador.atacando) novoEstado = "atacando";
    else if (!jogador.noChao) novoEstado = "pulando";
    else if (Math.abs(jogador.velX) > 0.2) novoEstado = "andando";
    else novoEstado = "parado";

    if (novoEstado !== jogador.estado && novoEstado !== "atacando") {
      jogador.quadro = 0; jogador.tempoQuadro = 0;   // reinicia animacao ao trocar
    }
    jogador.estado = novoEstado;

    // Avanca animacao
    avancarAnimacao();
  }

  // Quais quadros tocar em cada estado
  function quadrosDoEstado() {
    switch (jogador.estado) {
      case "andando":  return ATLAS_MAP.walk;
      case "pulando":  return ATLAS_MAP.jump;
      case "atacando": return ATLAS_MAP.attack;
      default:         return ATLAS_MAP.idle;
    }
  }

  function avancarAnimacao() {
    const lista = quadrosDoEstado();
    if (!lista || lista.length === 0) return;
    if (jogador.estado === "atacando") {
      // Sincroniza o quadro do ataque com o tempo restante do golpe
      const prog = 1 - (jogador.tempoAtaque / jogador.DURACAO_ATAQUE);
      jogador.quadro = Math.min(lista.length - 1, Math.floor(prog * lista.length));
    } else if (jogador.estado === "andando") {
      jogador.tempoQuadro++;
      if (jogador.tempoQuadro >= 6) { jogador.tempoQuadro = 0; jogador.quadro = (jogador.quadro + 1) % lista.length; }
    } else {
      // parado/pulando: animacao lenta ou quadro unico
      jogador.tempoQuadro++;
      if (jogador.tempoQuadro >= 18) { jogador.tempoQuadro = 0; jogador.quadro = (jogador.quadro + 1) % lista.length; }
    }
  }

  // ----------------------------------------------------------------
  // RENDER
  // ----------------------------------------------------------------
  function render() {
    // --- Cenario: cobre toda a tela mantendo proporcao (cover) ---
    desenharCenarioCover();

    // --- Plataformas (desenhadas como saliencias semitransparentes
    //     para ficarem visiveis sobre o cenario detalhado) ---
    for (const p of plataformas) {
      ctx.fillStyle = "rgba(20,18,30,0.65)";
      ctx.fillRect(p.x, p.y, p.largura, p.altura);
      ctx.fillStyle = "rgba(120,90,110,0.7)";   // borda superior
      ctx.fillRect(p.x, p.y, p.largura, 3);
    }
    // --- Linha do chao (saliencia sutil) ---
    ctx.fillStyle = "rgba(15,12,22,0.55)";
    ctx.fillRect(chao.x, chao.y, chao.largura, chao.altura);
    ctx.fillStyle = "rgba(150,80,90,0.6)";
    ctx.fillRect(chao.x, chao.y, chao.largura, 3);

    // --- Jogador (sprite) ---
    desenharJogador();

    // --- Brilho da hitbox de ataque ---
    if (jogador.atacando && jogador.hitbox) {
      const alpha = jogador.tempoAtaque / jogador.DURACAO_ATAQUE;
      ctx.fillStyle = "rgba(120, 220, 255," + (0.10 + alpha * 0.20) + ")";
      ctx.fillRect(jogador.hitbox.x, jogador.hitbox.y, jogador.hitbox.largura, jogador.hitbox.altura);
    }
  }

  // Desenha o cenario cobrindo o canvas (estilo background-size: cover)
  function desenharCenarioCover() {
    const iw = imgCenario.width, ih = imgCenario.height;
    const escala = Math.max(LARGURA_VIRTUAL / iw, ALTURA_VIRTUAL / ih);
    const dw = iw * escala, dh = ih * escala;
    const dx = (LARGURA_VIRTUAL - dw) / 2;
    const dy = (ALTURA_VIRTUAL - dh);   // ancora pela base (mostra o chao do cenario)
    ctx.drawImage(imgCenario, dx, dy, dw, dh);
    // Escurece um pouco para destacar o personagem
    ctx.fillStyle = "rgba(10,8,20,0.18)";
    ctx.fillRect(0, 0, LARGURA_VIRTUAL, ALTURA_VIRTUAL);
  }

  // ----------------------------------------------------------------
  // Desenha o jogador usando o quadro atual do atlas.
  // O sprite e ancorado pela base (pes) e centralizado na caixa.
  // ----------------------------------------------------------------
  function desenharJogador() {
    const lista = quadrosDoEstado();
    const idx = (lista && lista.length) ? lista[Math.min(jogador.quadro, lista.length - 1)] : ATLAS_MAP.idle[0];
    const r = ATLAS_RECTS[idx];
    if (!r) return;
    const [sx, sy, sw, sh] = r;

    const dh = sh * fatorSprite;
    const dw = sw * fatorSprite;
    // pes do jogador (base da caixa de colisao)
    const pesX = jogador.x + jogador.largura / 2;
    const pesY = jogador.y + jogador.altura;
    let dx = pesX - dw / 2;
    let dy = pesY - dh;

    // Sombra no chao
    ctx.fillStyle = "rgba(0,0,0,0.30)";
    ctx.beginPath();
    ctx.ellipse(pesX, pesY - 1, jogador.largura * 0.7, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (jogador.direcao === 1) {
      ctx.drawImage(imgAtlas, sx, sy, sw, sh, dx, dy, dw, dh);
    } else {
      // Espelha horizontalmente para olhar a esquerda
      ctx.save();
      ctx.translate(pesX, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(imgAtlas, sx, sy, sw, sh, -dw / 2, dy, dw, dh);
      ctx.restore();
    }
  }

  // Calcula o fator de escala do sprite com base no quadro "parado".
  function calcularFatorSprite() {
    const idx = ATLAS_MAP.idle[0];
    const r = ATLAS_RECTS[idx];
    if (r) fatorSprite = ALTURA_SPRITE / r[3];
  }

  // ----------------------------------------------------------------
  // GAME LOOP
  // ----------------------------------------------------------------
  let iniciado = false;
  function loop() {
    if (!iniciado) { calcularFatorSprite(); iniciado = true; }
    update();
    render();
    requestAnimationFrame(loop);
  }

  setTimeout(() => { const a = document.getElementById("ajuda"); if (a) a.style.opacity = "0"; }, 6000);
</script>
</body>
</html>
